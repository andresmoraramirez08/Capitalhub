<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CapitalHub - Iniciar Sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fuente limpia similar a la del prediseño -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* ==========================================================================
           SECCIÓN PARA MODIFICAR EL TAMAÑO Y ESPACIADO DEL LOGO
           Puedes modificar fácilmente estos valores para ajustar el tamaño del logo:
           ========================================================================== */
        :root {
            --logo-width: 220px;
            /* Ancho visible del logo (ej: 180px, 220px, 260px) */
            --logo-height: 80px;
            /* Altura del contenedor del logo */
            --logo-zoom: 1.6;
            /* Factor de ampliación para eliminar bordes transparentes */
            --logo-margin-bottom: 0.75rem;
            /* Separación con el texto inferior */
        }

        /* Contenedor que recorta los espacios transparentes vacíos de la imagen */
        .logo-container {
            width: var(--logo-width);
            height: var(--logo-height);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: var(--logo-margin-bottom);
        }

        .logo-personalizado {
            width: calc(var(--logo-width) * var(--logo-zoom));
            max-width: none;
            height: auto;
            object-fit: contain;
            display: block;
        }
    </style>
</head>

<body class="bg-[#0a0a0a] text-white min-h-screen flex items-center justify-center p-4 antialiased">

    <div class="bg-[#121212] p-8 rounded-2xl w-full max-w-md border border-[#27272a] shadow-2xl">

        <!-- Cabecera y Logo Oficial -->
        <div class="flex flex-col items-center mb-6">
            <div class="logo-container">
                <img src="Logo_blanco.png" alt="Capital Barbería Logo" class="logo-personalizado">
            </div>

            <h2 class="text-xl font-semibold mt-1">Acceso al Sistema</h2>
            <p class="text-zinc-400 text-sm mt-1">Ingresa tus credenciales para continuar</p>
        </div>

        <!-- Formulario -->
        <p id="login-error" class="hidden mb-4 text-sm text-red-300 bg-red-950/50 border border-red-800 rounded-lg px-3 py-2"></p>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-sm font-medium mb-2 text-zinc-300">Correo Electrónico</label>
                <input type="email" id="correo" required
                    class="w-full px-4 py-3.5 rounded-xl bg-[#0a0a0a] border border-[#27272a] focus:border-[#e5e5e5] focus:ring-1 focus:ring-[#e5e5e5] focus:outline-none transition-all text-white placeholder-zinc-600"
                    placeholder="usuario@barberiacapital.com">
            </div>
            <div>
                <label class="block text-sm font-medium mb-2 text-zinc-300">Contraseña</label>
                <input type="password" id="password" required
                    class="w-full px-4 py-3.5 rounded-xl bg-[#0a0a0a] border border-[#27272a] focus:border-[#e5e5e5] focus:ring-1 focus:ring-[#e5e5e5] focus:outline-none transition-all text-white placeholder-zinc-600"
                    placeholder="••••••••">
            </div>

            <!-- Botón estilo "Reservar Cita Online" del prediseño -->
            <button type="submit"
                class="w-full bg-[#e5e5e5] text-black font-semibold py-3.5 mt-4 rounded-xl hover:bg-white transition-colors duration-200 shadow-[0_0_15px_rgba(229,229,229,0.1)]">
                Iniciar Sesión
            </button>
        </form>
    </div>
    <script>
        // Un solo manejador de login (antes había dos y competían entre sí)
        const loginForm = document.getElementById('loginForm');
        const mensajeError = document.getElementById('login-error');
        const btnLogin = loginForm.querySelector('button[type="submit"]');

        // Si llegamos aquí porque el token venció, lo avisamos
        if (new URLSearchParams(window.location.search).get('sesion') === 'expirada') {
            mensajeError.textContent = 'Tu sesión expiró. Vuelve a iniciar sesión.';
            mensajeError.classList.remove('hidden');
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            mensajeError.classList.add('hidden');
            btnLogin.disabled = true;
            btnLogin.textContent = 'Verificando...';

            const email = document.getElementById('correo').value.trim();
            const password = document.getElementById('password').value;

            try {
                // Ruta relativa: funciona en localhost y cuando se suba a un servidor
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();

                if (response.ok) {
                    localStorage.clear();
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('nombre', data.nombre || '');
                    localStorage.setItem('usuario_id', data.id || '');
                    localStorage.setItem('rol', String(data.rol));
                    if (data.barbero_id) localStorage.setItem('barbero_id', data.barbero_id);
                    // Los clientes (rol 3) van a su portal, no al panel
                    window.location.href = String(data.rol) === '3' ? 'mis-citas.html' : 'dashboard.html';
                    return;
                }
                mensajeError.textContent = data.message || 'Credenciales inválidas';
                mensajeError.classList.remove('hidden');
            } catch (error) {
                console.error('Error en el login:', error);
                mensajeError.textContent = 'No se pudo conectar con el servidor.';
                mensajeError.classList.remove('hidden');
            }
            btnLogin.disabled = false;
            btnLogin.textContent = 'Iniciar Sesión';
        });
    </script>
</body>

</html>
