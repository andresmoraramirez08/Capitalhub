<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CapitalHub - Catálogo de Servicios</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0a0a0a] text-white flex h-screen font-sans">
    
    <!-- Menú Lateral -->
    <aside class="w-64 bg-[#111111] border-r border-zinc-800 flex flex-col">
        <div class="p-6 border-b border-zinc-800 flex items-center gap-3">
            <img src="Logo_blanco.png" alt="Logo CapitalHub" class="h-10 w-auto object-contain">
            <h2 class="text-xl font-bold tracking-wider">CAPITAL<span class="text-zinc-500">HUB</span></h2>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="dashboard.html" class="block px-4 py-2 text-zinc-400 hover:bg-zinc-800 hover:text-white rounded-lg transition">Dashboard</a>
            <a href="citas.html" class="block px-4 py-2 text-zinc-400 hover:bg-zinc-800 hover:text-white rounded-lg transition">Agenda de Citas</a>
            <a href="catalogo.html" id="menu-catalogo" class="block px-4 py-2 text-zinc-400 hover:bg-zinc-800 hover:text-white rounded-lg transition">Catálogo</a>
            <a href="clientes.html" id="menu-clientes" class="block px-4 py-2 text-zinc-400 hover:bg-zinc-800 hover:text-white rounded-lg transition">Clientes</a>
            <a href="barberos.html" id="menu-barberos" class="block px-4 py-2 text-zinc-400 hover:bg-zinc-800 hover:text-white rounded-lg transition">Barberos</a>
            <a href="servicios.html" id="menu-servicios" class="block px-4 py-2 bg-zinc-800 rounded-lg text-white">Servicios</a>
        </nav>
        <div class="p-4 border-t border-zinc-800">
            <button onclick="cerrarSesion()" class="w-full bg-red-900/50 border border-red-700 text-red-200 px-4 py-2 rounded-lg hover:bg-red-800 transition">
                Cerrar Sesión
            </button>
        </div>
    </aside>

    <!-- Contenido Principal -->
    <main class="flex-1 p-8 overflow-y-auto">
        <header class="mb-10">
            <h1 class="text-3xl font-bold">Catálogo de Servicios</h1>
            <p class="text-zinc-400 mt-1">Define los cortes, precios y duración estimada.</p>
        </header>
        
        <!-- Formulario -->
        <div class="bg-[#111111] p-6 rounded-xl border border-zinc-800 max-w-lg">
            <form id="form-servicio" class="space-y-4">
                <div>
                    <label class="block text-zinc-400 text-sm mb-1">Nombre del Servicio</label>
                    <input type="text" id="nombre" placeholder="Ej. Corte Fade o Arreglo de Barba" required class="w-full bg-[#0a0a0a] border border-zinc-700 rounded p-2 text-white focus:outline-none focus:border-zinc-500">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-zinc-400 text-sm mb-1">Precio ($)</label>
                        <input type="number" id="precio" step="0.01" min="0" required class="w-full bg-[#0a0a0a] border border-zinc-700 rounded p-2 text-white focus:outline-none focus:border-zinc-500">
                    </div>
                    <div>
                        <label class="block text-zinc-400 text-sm mb-1">Duración (minutos)</label>
                        <input type="number" id="duracion" min="1" required class="w-full bg-[#0a0a0a] border border-zinc-700 rounded p-2 text-white focus:outline-none focus:border-zinc-500">
                    </div>
                </div>
                <button type="submit" class="w-full bg-zinc-100 text-black font-semibold py-2 rounded hover:bg-white transition mt-4">
                    Guardar Servicio
                </button>
            </form>
        </div>

        <!-- Tabla de Servicios -->
        <div class="mt-10 max-w-4xl">
            <h2 class="text-xl font-bold mb-4">Servicios Disponibles</h2>
            <div class="bg-[#111111] rounded-xl border border-zinc-800 overflow-hidden">
                <table class="w-full text-left text-sm text-zinc-400">
                    <thead class="bg-zinc-800/50 text-white border-b border-zinc-800">
                        <tr>
                            <th class="px-4 py-3 font-semibold">Servicio</th>
                            <th class="px-4 py-3 font-semibold">Precio</th>
                            <th class="px-4 py-3 font-semibold">Duración</th>
                            <th class="px-4 py-3 font-semibold text-right">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="lista-servicios" class="divide-y divide-zinc-800">
                        <!-- Los servicios se inyectarán aquí -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal Editar Servicio -->
    <div id="modal-editar-servicio" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 p-4">
        <div class="bg-[#111111] border border-zinc-800 rounded-xl w-full max-w-md p-6">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-3 mb-4">
                <h3 class="text-lg font-bold text-white">Editar Servicio</h3>
                <button onclick="cerrarModalServicio()" class="text-zinc-400 hover:text-white text-xl font-bold">&times;</button>
            </div>
            <form id="form-editar-servicio" class="space-y-4">
                <input type="hidden" id="edit-serv-id">
                <div>
                    <label class="block text-xs text-zinc-400 mb-1">Nombre del Servicio</label>
                    <input type="text" id="edit-serv-nombre" required class="w-full bg-[#0a0a0a] border border-zinc-700 rounded p-2 text-sm text-white">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">Precio ($)</label>
                        <input type="number" id="edit-serv-precio" step="0.01" min="0" required class="w-full bg-[#0a0a0a] border border-zinc-700 rounded p-2 text-sm text-white">
                    </div>
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">Duración (min)</label>
                        <input type="number" id="edit-serv-duracion" min="1" required class="w-full bg-[#0a0a0a] border border-zinc-700 rounded p-2 text-sm text-white">
                    </div>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="cerrarModalServicio()" class="px-4 py-2 rounded bg-zinc-800 text-sm text-zinc-300 hover:bg-zinc-700">Cancelar</button>
                    <button type="submit" class="px-4 py-2 rounded bg-zinc-100 text-black text-sm font-semibold hover:bg-white">Guardar cambios</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';

        const rolUsuario = localStorage.getItem('rol');
        if (rolUsuario !== '1') {
            window.location.href = 'dashboard.html';
        }

        let serviciosCache = [];

        document.getElementById('form-servicio').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombre = document.getElementById('nombre').value;
            const precio = document.getElementById('precio').value;
            const duracion_minutos = document.getElementById('duracion').value;

            try {
                const response = await fetch('/api/servicios/registrar', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ nombre, precio, duracion_minutos })
                });

                const data = await response.json();

                if (response.ok) {
                    alert('¡Servicio registrado con éxito!');
                    document.getElementById('form-servicio').reset();
                    cargarServicios();
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error de conexión.');
            }
        });

        function cerrarSesion() {
            localStorage.clear();
            window.location.href = 'login.html';
        }

        async function cargarServicios() {
            try {
                const response = await fetch('/api/servicios', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                
                if (response.ok) {
                    serviciosCache = await response.json();
                    const tbody = document.getElementById('lista-servicios');
                    tbody.innerHTML = ''; 

                    serviciosCache.forEach(servicio => {
                        tbody.innerHTML += `
                            <tr class="hover:bg-zinc-800/30 transition">
                                <td class="px-4 py-3 text-white font-medium">${servicio.nombre}</td>
                                <td class="px-4 py-3">$${Number(servicio.precio).toFixed(2)}</td>
                                <td class="px-4 py-3">${servicio.duracion_minutos} min</td>
                                <td class="px-4 py-3 text-right space-x-3">
                                    <button onclick="abrirModalServicio('${servicio.id}')" class="text-blue-400 hover:text-blue-300 transition text-sm font-medium">Editar</button>
                                    <button onclick="borrarServicio('${servicio.id}')" class="text-red-400 hover:text-red-300 transition text-sm">Eliminar</button>
                                </td>
                            </tr>
                        `;
                    });
                }
            } catch (error) {
                console.error('Error al cargar la tabla:', error);
            }
        }

        function abrirModalServicio(id) {
            const s = serviciosCache.find(item => String(item.id) === String(id));
            if (!s) return;

            document.getElementById('edit-serv-id').value = s.id;
            document.getElementById('edit-serv-nombre').value = s.nombre || '';
            document.getElementById('edit-serv-precio').value = s.precio;
            document.getElementById('edit-serv-duracion').value = s.duracion_minutos;

            const modal = document.getElementById('modal-editar-servicio');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function cerrarModalServicio() {
            const modal = document.getElementById('modal-editar-servicio');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        document.getElementById('form-editar-servicio').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('edit-serv-id').value;
            const nombre = document.getElementById('edit-serv-nombre').value;
            const precio = document.getElementById('edit-serv-precio').value;
            const duracion_minutos = document.getElementById('edit-serv-duracion').value;

            try {
                const response = await fetch(`/api/servicios/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ nombre, precio, duracion_minutos })
                });

                const data = await response.json();
                if (response.ok) {
                    cerrarModalServicio();
                    cargarServicios();
                } else {
                    alert('Error: ' + (data.message || 'No se pudo actualizar'));
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error de conexión.');
            }
        });

        async function borrarServicio(idServicio) {
            const confirmar = confirm("¿Estás seguro de que deseas eliminar este servicio? Esta acción no se puede deshacer.");
            
            if (!confirmar) return;

            try {
                const response = await fetch(`/api/servicios/${idServicio}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (response.ok) {
                    alert("Servicio eliminado exitosamente");
                    cargarServicios();
                } else {
                    console.error("Error al eliminar");
                    alert("Hubo un problema al intentar eliminar el servicio.");
                }
            } catch (error) {
                console.error("Error de conexión:", error);
            }
        }

        cargarServicios();
    </script>
</body>
</html>
